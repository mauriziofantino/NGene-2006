# HackRF native CI8: 8183800 complex samples/s, GPS L1 centre by default.
# SIMD DC removal and int16 Q6 mixer; original ADC bytes are preserved.
# IF is derived from the actual RF centre; no additional digital mixer is used.
# Gains are hardware settings; analog response/noise are not identical to SiGe.

# 0..40, multiples of 8.
[LNA gain (dB)]
32

# 0..62, multiples of 2.
[VGA gain (dB)]
56

# Tune IF/VGA once before starting the receiver timeline; then freeze the gains.
[Auto tune gains]
1

# Standard deviation per ADC component after subtracting its measured DC.
# Four sigma plus raw DC must fit the ADC; clipping is also checked directly.
[Auto tune target RMS]
28

[RF amplifier]
0

# Set 1 only to supply an antenna requiring HackRF's bias supply.
[Antenna power]
0

[Baseband bandwidth (Hz)]
5000000

# Exact GPS L1 centre gives IF=0. Use 1575458400 to compare at NCO IF=+38400.
[Center frequency (Hz)]
1575420000

# Optional when selecting one of several devices:
# Add a tag named Serial number and the serial on the following line.
